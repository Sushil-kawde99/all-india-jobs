services:
  - type: web
    name: all-india-jobs-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CONTACT_NAME
        value: Sushil
      - key: ADMIN_CONTACT_PHONE
        sync: false
      - key: SITE_URL
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
