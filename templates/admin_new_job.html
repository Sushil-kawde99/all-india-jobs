<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post New Vacancy | Admin Control</title>
    {% include "partials/favicon_head.html" %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#101B35', teal: '#0DAF9C', surface: '#F6F8FC' }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-slate-800 p-6 font-sans">
    <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
        <a href="/admin" class="text-xs font-semibold text-slate-500 hover:text-navy">&larr; Back to Dashboard</a>
        <h1 class="text-2xl font-bold text-navy mt-2 mb-6">Post New Vacancy</h1>

        <form method="POST" action="/admin/jobs/new" class="space-y-4 text-xs font-semibold">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block mb-1 text-navy">Job Title *</label>
                    <input type="text" name="title" required placeholder="e.g. Graduate Engineer Trainee" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Company *</label>
                    <input type="text" name="company" required value="{{ default_company or '' }}" placeholder="e.g. Tata Consultancy Services" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Category *</label>
                    <select name="category" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                        {% for cat in categories %}
                        <option value="{{ cat.name }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-navy">State *</label>
                    <select name="state" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                        <option value="Remote">All-India Remote</option>
                        {% for st in all_states %}
                        <option value="{{ st }}">{{ st }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-navy">City *</label>
                    <input type="text" name="city" required placeholder="e.g. Pune / Bengaluru" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Min Salary (Annual ₹)</label>
                    <input type="number" name="salary_min" placeholder="400000" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Max Salary (Annual ₹)</label>
                    <input type="number" name="salary_max" placeholder="700000" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Experience</label>
                    <input type="text" name="experience" value="Fresher" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Qualification</label>
                    <input type="text" name="qualification" placeholder="B.E. / B.Tech / Any Graduate" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Application Last Date (Deadline)</label>
                    <input type="date" name="last_date" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Official Source / Circular URL</label>
                    <input type="url" name="source_url" placeholder="https://company.com/careers" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div class="sm:col-span-2">
                    <label class="block mb-1 text-navy">Official Direct Apply URL *</label>
                    <input type="url" name="apply_url" required placeholder="https://company.com/careers/apply" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div class="sm:col-span-2">
                    <label class="block mb-1 text-navy">Job Description & Responsibilities *</label>
                    <textarea name="description" rows="5" required placeholder="Outline role responsibilities and requirements..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm"></textarea>
                </div>
            </div>

            <button type="submit" class="px-6 py-3 rounded-xl bg-teal text-white font-bold text-sm shadow-md">
                Publish Vacancy
            </button>
        </form>
    </div>
    {% include "partials/popups.html" %}
</body>
</html>
