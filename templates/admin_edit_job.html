<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vacancy #{{ job.id }} | Admin Control</title>
    {% include "partials/favicon_head.html" %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { navy: '#101B35', teal: '#0DAF9C', surface: '#F6F8FC' } }
            }
        }
    </script>
</head>
<body class="bg-surface text-slate-800 p-6 font-sans">
    <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
        <a href="/admin" class="text-xs font-semibold text-slate-500 hover:text-navy">&larr; Back to Dashboard</a>
        <h1 class="text-2xl font-bold text-navy mt-2 mb-6">Edit Vacancy #{{ job.id }}</h1>

        <form method="POST" action="/admin/jobs/edit/{{ job.id }}" class="space-y-4 text-xs font-semibold">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block mb-1 text-navy">Job Title *</label>
                    <input type="text" name="title" required value="{{ job.title }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Company *</label>
                    <input type="text" name="company" required value="{{ job.company }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Category *</label>
                    <select name="category" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                        {% for cat in categories %}
                        <option value="{{ cat.name }}" {% if job.category == cat.name %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-navy">State *</label>
                    <select name="state" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                        <option value="Remote" {% if job.state == 'Remote' %}selected{% endif %}>All-India Remote</option>
                        {% for st in all_states %}
                        <option value="{{ st }}" {% if job.state == st %}selected{% endif %}>{{ st }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-navy">City *</label>
                    <input type="text" name="city" required value="{{ job.city }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Min Salary (Annual ₹)</label>
                    <input type="number" name="salary_min" value="{{ job.salary_min or '' }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Max Salary (Annual ₹)</label>
                    <input type="number" name="salary_max" value="{{ job.salary_max or '' }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Experience</label>
                    <input type="text" name="experience" value="{{ job.experience }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Qualification</label>
                    <input type="text" name="qualification" value="{{ job.qualification or '' }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Application Last Date (Extend if मुदतवाढ)</label>
                    <input type="date" name="last_date" value="{{ job.last_date or '' }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div>
                    <label class="block mb-1 text-navy">Official Source / Circular URL</label>
                    <input type="url" name="source_url" value="{{ job.source_url or '' }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div class="sm:col-span-2">
                    <label class="block mb-1 text-navy">Official Direct Apply URL *</label>
                    <input type="url" name="apply_url" required value="{{ job.apply_url }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                </div>

                <div class="sm:col-span-2">
                    <label class="block mb-1 text-navy">Job Description & Responsibilities *</label>
                    <textarea name="description" rows="5" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">{{ job.description }}</textarea>
                </div>
            </div>

            <button type="submit" class="px-6 py-3 rounded-xl bg-teal text-white font-bold text-sm shadow-md">
                Update Vacancy
            </button>
        </form>
    </div>
    {% include "partials/popups.html" %}
</body>
</html>
