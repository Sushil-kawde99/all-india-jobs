name: Daily Govt & Private Job Sync + Archive Cleanup

on:
  schedule:
    # Runs every day at 06:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 libsql-client python-dotenv

      - name: Run Daily Sync & Auto-Archive Expired (16d+)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python sync_service.py

      - name: Save Archive History CSV to Repository
        run: |
          git config user.name "JobDisha Bot"
          git config user.email "bot@jobdisha.in"
          git add archive/ || true
          git diff --staged --quiet || (git commit -m "chore: update expired jobs CSV archive" && git push)
